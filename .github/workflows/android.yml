name: Build Android APK → Release

on:
  push:
    branches: [claude/bible-history-gamification-5i775d]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6.3"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -e
          cd /tmp
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -deststoretype pkcs12

      - name: Install Android gradle build template
        run: |
          set -e
          mkdir -p android/build
          unzip -oq "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build
          printf '%s.stable' "${GODOT_VERSION}" > android/.build_version
          touch android/build/.gdignore

      - name: Import project (generates editor settings)
        run: godot --headless --path . --import || true

      - name: Configure editor settings (SDK / JDK / keystore)
        run: |
          set -e
          f=$(ls "$HOME"/.config/godot/editor_settings-4*.tres 2>/dev/null | head -1)
          if [ -z "$f" ]; then
            mkdir -p "$HOME/.config/godot"
            f="$HOME/.config/godot/editor_settings-4.tres"
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$f"
          fi
          python3 - "$f" <<'PY'
          import re, sys, os
          f = sys.argv[1]
          s = open(f, encoding="utf-8").read()
          kv = {
            "export/android/android_sdk_path": os.environ["ANDROID_HOME"],
            "export/android/java_sdk_path": os.environ.get("JAVA_HOME", ""),
            "export/android/debug_keystore": os.path.expanduser("~/debug.keystore"),
            "export/android/debug_keystore_user": "androiddebugkey",
            "export/android/debug_keystore_pass": "android",
          }
          for k, v in kv.items():
              line = '%s = "%s"' % (k, v)
              if re.search(re.escape(k) + r' = ".*?"', s):
                  s = re.sub(re.escape(k) + r' = ".*?"', line, s)
              else:
                  s = s.replace("[resource]", "[resource]\n" + line, 1)
          open(f, "w", encoding="utf-8").write(s)
          print("configured:", f)
          PY

      - name: Export debug APK
        run: |
          set -e
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/bible-voyage.apk
          ls -la build/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bible-voyage-apk
          path: build/bible-voyage.apk

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: "APK 빌드 #${{ github.run_number }}"
          body: |
            한눈에 보는 성경 이야기 — 항해 · 디버그 APK (커밋 ${{ github.sha }})
            사이드로드하여 테스트하세요. (com.onescrollbible.voyage)
          prerelease: true
          files: build/bible-voyage.apk
